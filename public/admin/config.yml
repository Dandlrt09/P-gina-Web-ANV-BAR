# ANV·BAR — Decap CMS
# La interfaz de administración vive en /admin. Los archivos de contenido se
# guardan en content/ (productos, testimonios, diseñadora, contacto, categorías)
# y se publican por Git. No editar estas colecciones a mano sin revisar el
# loader (src/data/catalog.ts y src/data/contact.ts).

backend:
  name: git-gateway
  branch: main          # rama de publicación (obligatorio: el repo usa main, no master)

# Permite probar el editor en local: correr `npx decap-server` en la raíz del
# proyecto y abrir http://localhost:<puerto>/admin. En producción se usa
# git-gateway con Netlify Identity desde el dashboard de Netlify.
local_backend: true

# Media: las fotos se guardan en public/imagenes y se referencian como
# /imagenes/... (mismo formato que los `src` actuales del contenido).
media_folder: "public/imagenes"
public_folder: "/imagenes"

# Interfaz de Decap en español (los fallbacks usan inglés sin romper nada).
locale: 'es'

collections:
  # ------------------------------------------------------------------
  # Productos (un archivo JSON por pieza)
  # ------------------------------------------------------------------
  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    folder: "content/products"
    format: "json"
    create: true
    delete: true
    identifier_field: "id"
    slug: "{{fields.id}}"
    summary: "{{fields.name}} — ${{fields.priceCOP}}"
    description: "Catálogo de ANV·BAR: una pieza por archivo. El orden de presentación en la web lo define el identificador."
    editor:
      preview: false
    fields:
      - { label: "Identificador", name: "id", widget: "string", hint: "Clave única del producto (se usa en enlaces y favoritos). No debe repetirse. Ejemplo: vestido-floral-primavera." }
      - { label: "Nombre", name: "name", widget: "string" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        hint: "Debe ser una de las categorías del catálogo."
        options:
          - { label: "Vestidos", value: "Vestidos" }
          - { label: "Conjuntos", value: "Conjuntos" }
          - { label: "Camisas", value: "Camisas" }
          - { label: "Faldas", value: "Faldas" }
          - { label: "Pantalones", value: "Pantalones" }
          - { label: "Sets", value: "Sets" }
          - { label: "Accesorios", value: "Accesorios" }
      - { label: "Precio (COP)", name: "priceCOP", widget: "number", value_type: "int", min: 0, hint: "Precio en pesos colombianos, sin decimales. Ejemplo: 250000 se muestra como $250.000." }
      - { label: "Es novedad", name: "isNew", widget: "boolean", default: false, required: false, hint: "Al activarlo, la pieza aparece en la cinta de novedades de la portada y en el catálogo." }
      - { label: "Texto editorial", name: "editorial", widget: "text", hint: "Voz de marca de la ficha: una o dos frases." }
      - { label: "Tela", name: "fabric", widget: "string", hint: "Tela principal; se muestra en los datos técnicos de la ficha." }
      - { label: "Cuidados", name: "care", widget: "text", hint: "Instrucciones de lavado y cuidado de la prenda." }
      - label: "Tallas"
        name: "sizes"
        widget: "select"
        multiple: true
        min: 1
        options: ["XS", "S", "M", "L", "XL", "Único"]
        hint: "Marque cada talla disponible. Para accesorios (talla única) marque solo “Único”."
      - label: "Colores"
        name: "colors"
        widget: "list"
        collapsed: false
        summary: "{{fields.name}}"
        hint: "Variantes de color reales de la pieza, cada una con su foto."
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - { label: "Código hex", name: "hex", widget: "string", hint: "Color real de la pieza, en formato #rrggbb. Ejemplo: #58232c." }
          - label: "Imagen"
            name: "image"
            widget: "object"
            collapsed: false
            required: false
            fields:
              - { label: "Foto principal", name: "src", widget: "image", required: false, hint: "Foto real de esta variante. Si queda vacío, la interfaz muestra un placeholder elegante con el texto alt." }
              - label: "Fotos adicionales"
                name: "gallery"
                widget: "list"
                required: false
                collapsed: false
                hint: "Más fotos de esta variante (aparecen en la ficha). Agregue una entrada por foto. La primera se usa como vista al pasar el mouse en las tarjetas."
                fields:
                  - { label: "Foto", name: "src", widget: "image", required: false }
              - { label: "Texto alternativo (accesibilidad)", name: "label", widget: "string", required: false, hint: "Texto leído por lectores de pantalla y mostrado si la foto no carga. Ejemplo: Vestido Trinitaria — Marfil." }

  # ------------------------------------------------------------------
  # Testimonios (un archivo único)
  # ------------------------------------------------------------------
  - name: "testimonios"
    label: "Testimonios"
    editor:
      preview: false
    files:
      - name: "lista-testimonios"
        label: "Testimonios de clientas"
        file: "content/testimonials.json"
        fields:
          - label: "Testimonios"
            name: "testimonials"
            widget: "list"
            collapsed: false
            summary: "{{fields.name}} — {{fields.city}}"
            fields:
              - { label: "Nombre", name: "name", widget: "string", hint: "Usar “Clienta ANV·BAR” si prefiere anonimato." }
              - { label: "Ciudad", name: "city", widget: "string", required: false }
              - { label: "Texto", name: "text", widget: "text" }

  # ------------------------------------------------------------------
  # Diseñadora (un archivo único)
  # ------------------------------------------------------------------
  - name: "disenadora"
    label: "Diseñadora"
    editor:
      preview: false
    files:
      - name: "perfil"
        label: "Perfil de la diseñadora"
        file: "content/designer.json"
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - { label: "Rol", name: "role", widget: "string" }
          - { label: "Biografía", name: "bio", widget: "text" }
          - label: "Colección"
            name: "collection"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Nombre", name: "name", widget: "string", hint: "Ejemplo: RUBRA." }
              - { label: "Historia", name: "story", widget: "text" }
          - { label: "Frase de marca", name: "claim", widget: "string" }

  # ------------------------------------------------------------------
  # Contacto (un archivo único)
  # ------------------------------------------------------------------
  - name: "contacto"
    label: "Contacto"
    editor:
      preview: false
    files:
      - name: "canales"
        label: "Canales de contacto"
        file: "content/contact.json"
        fields:
          - label: "Canales"
            name: "contact"
            widget: "list"
            collapsed: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Nombre del canal", name: "label", widget: "string", hint: "Ejemplo: WhatsApp, Instagram." }
              - { label: "Handle / número", name: "handle", widget: "string", hint: "Texto exacto que se muestra: número o @usuario." }
              - { label: "Enlace", name: "href", widget: "string" }
              - { label: "Nota", name: "note", widget: "string", required: false }

  # ------------------------------------------------------------------
  # Categorías (un archivo único)
  # ------------------------------------------------------------------
  - name: "categorias"
    label: "Categorías"
    editor:
      preview: false
    files:
      - name: "lista-categorias"
        label: "Categorías del catálogo"
        file: "content/categories.json"
        fields:
          - label: "Categorías"
            name: "categories"
            widget: "list"
            collapsed: false
            hint: "Este es el ORDEN de presentación del catálogo (“todo a la vista”). Si agrega una categoría nueva, haga que también figure en la lista de “Categoría” de los productos."